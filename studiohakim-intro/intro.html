<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StudioHakim Productions intro</title>
<style>
  @font-face { font-family: "SH Display"; src: url("assets/fonts/InterDisplay-Black.otf"); font-weight: 900; }
  @font-face { font-family: "SH Light"; src: url("assets/fonts/Inter-ExtraLight.otf"); font-weight: 200; }
  :root { --gold-1: #fff3d1; --gold-2: #f1c56b; --gold-3: #b9852f; --gold-4: #6e4a17; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050404; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 46%, #1d150c 0%, #0b0806 45%, #030303 100%); }
  canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #world { position: absolute; inset: 0; transform-origin: 50% 46%; }
  #beam { position: absolute; left: 538px; top: 0; width: 4px; height: 1920px;
    background: #fff6dc; box-shadow: 0 0 30px 8px rgba(255,226,160,.8), 0 0 120px 40px rgba(241,197,107,.35);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 46%, transparent);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 46%, transparent 100%); transform-origin: 50% 46%; }
  #emblem { position: absolute; left: 340px; top: 420px; width: 400px; height: 400px; }
  #title { position: absolute; left: 0; right: 0; top: 860px; text-align: center;
    font-family: "SH Display"; font-weight: 900; font-size: 190px; line-height: .94; letter-spacing: .02em; }
  #title .line { display: block; white-space: nowrap; }
  #title .ch { display: inline-block;
    background-image: linear-gradient(100deg, transparent 0%, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%, transparent 100%),
                      linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 38%, var(--gold-3) 70%, var(--gold-4) 100%);
    background-size: 300% 100%, 100% 100%; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 30px rgba(241,197,107,.25)); }
  #rule { position: absolute; top: 1268px; left: 540px; width: 600px; height: 2px; margin-left: -300px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent); }
  #sub { position: absolute; left: 0; right: 0; top: 1310px; text-align: center; color: var(--gold-1);
    font-family: "SH Light"; font-weight: 200; font-size: 52px; letter-spacing: .3em; text-indent: .3em; }
  #sub .ch { display: inline-block; }
  #flash { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 46%, #fff8e6, rgba(255,230,180,.6) 40%, transparent 80%); }
  #shock { position: absolute; left: 540px; top: 883px; width: 10px; height: 10px; border-radius: 50%;
    border: 6px solid rgba(255,236,190,.9); box-shadow: 0 0 60px 10px rgba(241,197,107,.6); }
  #black { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="world">
    <div id="beam"></div>
    <svg id="emblem" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff3d1"/><stop offset=".45" stop-color="#f1c56b"/><stop offset="1" stop-color="#8a5c1c"/>
        </linearGradient>
      </defs>
      <circle id="ring" cx="200" cy="200" r="180" fill="none" stroke="url(#g)" stroke-width="6" transform="rotate(-90 200 200)"/>
      <circle id="ring2" cx="200" cy="200" r="158" fill="none" stroke="url(#g)" stroke-width="2" opacity=".6" transform="rotate(90 200 200)"/>
      <g id="ticks" stroke="url(#g)" stroke-width="3"></g>
      <text id="mono" x="200" y="248" text-anchor="middle" font-family="SH Display" font-weight="900" font-size="150" fill="url(#g)" letter-spacing="-6">SH</text>
    </svg>
    <div id="title"><span class="line">STUDIO</span><span class="line">HAKIM</span></div>
    <div id="rule"></div>
    <div id="sub">PRODUCTIONS</div>
    <div id="shock"></div>
  </div>
  <div id="flash"></div>
  <div id="black"></div>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

const HIT = 2.4; // the impact, in page seconds (matches assets/impact.wav)

// split words into letters so each can move
for (const el of document.querySelectorAll('#title .line, #sub')) {
  el.innerHTML = [...el.textContent].map((c) => `<span class="ch">${c}</span>`).join('');
}
const titleChars = [...document.querySelectorAll('#title .ch')];
const subChars = [...document.querySelectorAll('#sub .ch')];

// film-reel ticks around the emblem
const ticks = $('#ticks');
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2, r1 = 166, r2 = i % 6 === 0 ? 146 : 156;
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', 200 + Math.cos(a) * r1); l.setAttribute('y1', 200 + Math.sin(a) * r1);
  l.setAttribute('x2', 200 + Math.cos(a) * r2); l.setAttribute('y2', 200 + Math.sin(a) * r2);
  ticks.appendChild(l);
}
const ticksEls = [...ticks.children];
const ring = $('#ring'), ring2 = $('#ring2');
const C1 = 2 * Math.PI * 180, C2 = 2 * Math.PI * 158;
ring.style.strokeDasharray = C1; ring2.style.strokeDasharray = C2;

// dust motes: fixed seeds, positions are a pure function of t
const ctx = $('#dust').getContext('2d');
const motes = Array.from({ length: 140 }, (_, i) => ({
  x: hash(i) * 1080, y: hash(i + 99) * 1920, r: .6 + hash(i + 7) * 2.6,
  vx: (hash(i + 3) - .5) * 30, vy: -10 - hash(i + 5) * 40, tw: hash(i + 11) * 6.28, z: hash(i + 13),
}));
const sparks = Array.from({ length: 70 }, (_, i) => ({
  a: hash(i + 500) * 6.283, v: 500 + hash(i + 600) * 1300, r: 1 + hash(i + 700) * 3, life: .6 + hash(i + 800) * 1.2,
}));

function drawDust(t) {
  ctx.clearRect(0, 0, 1080, 1920);
  const boost = t > HIT ? 1 + 2.5 * Math.exp(-(t - HIT) * 2.5) : 1;
  for (const m of motes) {
    const push = t > HIT ? (1 - Math.exp(-(t - HIT) * 2)) * 140 * (m.z + .3) : 0;
    let x = m.x + m.vx * t, y = m.y + m.vy * t;
    const dx = x - 540, dy = y - 883, d = Math.hypot(dx, dy) || 1;
    x += dx / d * push; y += dy / d * push;
    x = ((x % 1080) + 1080) % 1080; y = ((y % 1920) + 1920) % 1920;
    const a = (.15 + .35 * (.5 + .5 * Math.sin(t * 2 + m.tw))) * m.z * boost * prog(t, 0, .8);
    ctx.fillStyle = `rgba(255,214,150,${clamp(a)})`;
    ctx.beginPath(); ctx.arc(x, y, m.r, 0, 6.283); ctx.fill();
  }
  if (t >= HIT) {
    const s = t - HIT;
    for (const p of sparks) {
      if (s > p.life) continue;
      const k = s / p.life, dist = p.v * (1 - Math.exp(-s * 3)) / 3;
      const x = 540 + Math.cos(p.a) * dist, y = 883 + Math.sin(p.a) * dist;
      ctx.fillStyle = `rgba(255,230,180,${(1 - k) * .95})`;
      ctx.beginPath(); ctx.arc(x, y, p.r * (1 - k * .5), 0, 6.283); ctx.fill();
    }
  }
}

function frame(t) {
  drawDust(t);
  const after = t - HIT;

  // slow camera push the whole time, a short shake at the hit
  const shake = after > 0 ? Math.exp(-after * 9) * 14 : 0;
  const sx = shake * Math.sin(t * 90), sy = shake * Math.cos(t * 77);
  $('#world').style.transform = `translate(${sx}px, ${sy}px) scale(${1 + .06 * easeInOut(prog(t, 0, 8))})`;

  // beam of light grows toward the hit, then collapses into the flash
  const grow = easeInOut(prog(t, .2, HIT));
  const beam = $('#beam');
  beam.style.opacity = t < HIT ? .15 + .85 * grow : Math.max(0, 1 - after * 4);
  beam.style.transform = `scaleY(${.05 + .95 * grow}) scaleX(${1 + 3 * grow})`;

  // emblem: rings draw in before the hit, monogram lands with it
  const draw = easeInOut(prog(t, .6, HIT));
  ring.style.strokeDashoffset = C1 * (1 - draw);
  ring2.style.strokeDashoffset = C2 * (1 - easeInOut(prog(t, 1.0, HIT)));
  ticksEls.forEach((l, i) => { l.style.opacity = prog(t, 1.2 + i * .04, 1.4 + i * .04); });
  $('#ticks').setAttribute('transform', `rotate(${t * 6} 200 200)`);
  const mono = $('#mono'), mk = prog(t, HIT, HIT + .5);
  mono.style.opacity = mk;
  mono.setAttribute('transform', `translate(200 200) scale(${1.6 - .6 * easeOut(mk)}) translate(-200 -200)`);
  $('#emblem').style.opacity = prog(t, .5, 1);

  // title: letters slam in at the hit, tracking settles, then a sheen sweeps across
  titleChars.forEach((c, i) => {
    const k = prog(t, HIT + i * .03, HIT + .55 + i * .03);
    const e = backOut(k);
    c.style.opacity = clamp(k * 3);
    c.style.transform = `translateY(${(1 - e) * 60}px) scale(${1.5 - .5 * e})`;
    c.style.filter = `blur(${(1 - easeOut(k)) * 18}px) drop-shadow(0 6px 30px rgba(241,197,107,.25))`;
    const sheen = prog(t, 4.6 + i * .06, 5.9 + i * .06);
    c.style.backgroundPosition = `${100 - sheen * 100}% 0, 0 0`;
  });
  $('#title').style.letterSpacing = `${.02 + .1 * (1 - easeOut(prog(t, HIT, HIT + 1.6)))}em`;

  // divider and PRODUCTIONS
  $('#rule').style.transform = `scaleX(${easeOut(prog(t, 3.2, 4.0))})`;
  $('#rule').style.opacity = prog(t, 3.2, 3.4);
  subChars.forEach((c, i) => {
    const k = easeOut(prog(t, 3.4 + i * .045, 4.1 + i * .045));
    c.style.opacity = k;
    c.style.transform = `translateY(${(1 - k) * 24}px)`;
    c.style.filter = `blur(${(1 - k) * 8}px)`;
  });

  // impact flash and shockwave
  $('#flash').style.opacity = after < 0 ? 0 : Math.exp(-after * 5) * (after < .04 ? after / .04 : 1);
  const sh = $('#shock'), sk = prog(t, HIT, HIT + 1.1);
  sh.style.opacity = after < 0 ? 0 : (1 - sk) * .9;
  const size = 10 + easeOut(sk) * 2600;
  sh.style.width = sh.style.height = `${size}px`;
  sh.style.transform = 'translate(-50%, -50%)';
  sh.style.borderWidth = `${8 - 6 * sk}px`;

  // fade in from and out to black
  $('#black').style.opacity = Math.max(1 - prog(t, 0, .5), easeInOut(prog(t, 7.1, 8)));
}

window.film = { frame, duration: 8, ready: document.fonts.ready.then(() => Promise.all([...document.fonts].map((f) => f.load()))) };
</script>
</body>
</html>
