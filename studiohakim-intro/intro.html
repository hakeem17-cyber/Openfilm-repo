<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StudioHakim Productions intro</title>
<style>
  @font-face { font-family: "SH Display"; src: url("assets/fonts/InterDisplay-Black.otf"); font-weight: 900; }
  @font-face { font-family: "SH Light"; src: url("assets/fonts/Inter-ExtraLight.otf"); font-weight: 200; }
  :root { --gold-1: #fff4d6; --gold-2: #f3c86e; --gold-3: #c08a34; --gold-4: #6a4314; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #glow { position: absolute; inset: 0; background: radial-gradient(55% 32% at 50% 40%, rgba(120,78,24,.55), rgba(40,24,8,.25) 50%, transparent 80%); }
  #wordmark { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; white-space: nowrap;
    font-size: 112px; line-height: 1; letter-spacing: .05em; text-indent: .05em; }
  #wordmark span { background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 40%, var(--gold-3) 75%, var(--gold-4) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #wordmark .light { font-family: "SH Light"; font-weight: 200; }
  #wordmark .bold { font-family: "SH Display"; font-weight: 900; }
  #edge { position: absolute; top: 1120px; width: 6px; height: 170px; margin-left: -3px; border-radius: 3px;
    background: #fff8e8; box-shadow: 0 0 24px 6px rgba(255,226,160,.9), 0 0 90px 30px rgba(243,200,110,.45); }
  #sub { position: absolute; left: 0; right: 0; top: 1306px; text-align: center; color: #e9d3a6;
    font-family: "SH Light"; font-weight: 200; font-size: 34px; letter-spacing: .9em; text-indent: .9em; }
  #flare { position: absolute; left: -200px; width: 1480px; top: 748px; height: 24px; margin-top: -12px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255,250,235,1), rgba(255,214,140,.55) 25%, rgba(255,190,90,.12) 60%, transparent 100%);
    mix-blend-mode: screen; }
  #sheen { position: absolute; left: 0; top: 1100px; width: 260px; height: 280px; mix-blend-mode: overlay;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.95), transparent); }
  #flash { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 40%, #fffaf0, rgba(255,226,170,.55) 45%, transparent 85%); }
  #grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(85% 60% at 50% 45%, transparent 55%, rgba(0,0,0,.75) 100%); }
  #black { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <canvas id="ribbons" width="1080" height="1920"></canvas>
  <div id="flare"></div>
  <div id="wordmark"><span class="light">STUDIO</span><span class="bold">HAKIM</span></div>
  <div id="edge"></div>
  <div id="sheen"></div>
  <div id="sub">PRODUCTIONS</div>
  <div id="flash"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vignette"></div>
  <div id="black"></div>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const expoOut = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

const LOCK = 2.6;            // the ribbons lock into the mark: the hit (assets/hit.wav)
const CX = 540, CY = 760;    // the mark's center
const BAR = { w: 92, gap: 112, h: 560 };    // the H: two bars and a crossbar, in px at rest
const CROSS = { h: 64 };
const PALETTE = ['#fff4d6', '#ffe1a0', '#f3c86e', '#e0a64a', '#c08a34', '#f2b98c', '#a86d26', '#ffd27a'];

// ribbons: each lives inside a bar of the H; decoys fill the tunnel and fade away
const ribbons = [];
for (const side of [-1, 1]) {
  for (let i = 0; i < 110; i++) {
    const k = i + (side > 0 ? 1000 : 0);
    const inner = BAR.gap, outer = BAR.gap + BAR.w;
    const x0 = side * lerp(inner, outer, hash(k));
    ribbons.push({ x: x0, w: .8 + hash(k + 1) * 5.5, c: PALETTE[Math.floor(hash(k + 2) * PALETTE.length)],
      a: .25 + hash(k + 3) * .75, ph: hash(k + 4) * 6.28, sp: .6 + hash(k + 5) * 1.8, decoy: false,
      h0: -BAR.h / 2, h1: BAR.h / 2, e0: hash(k + 6) * 520, e1: hash(k + 7) * 520 });
  }
}
for (let i = 0; i < 180; i++) {
  const k = 5000 + i;
  ribbons.push({ x: (hash(k) - .5) * 900, w: .6 + hash(k + 1) * 4, c: PALETTE[Math.floor(hash(k + 2) * PALETTE.length)],
    a: .15 + hash(k + 3) * .5, ph: hash(k + 4) * 6.28, sp: .5 + hash(k + 5) * 2, decoy: true, h0: -BAR.h / 2, h1: BAR.h / 2, e0: hash(k + 6) * 700, e1: hash(k + 7) * 700 });
}
const cross = Array.from({ length: 34 }, (_, i) => ({
  y: (hash(9000 + i) - .5) * CROSS.h, w: .8 + hash(9100 + i) * 3.5, c: PALETTE[Math.floor(hash(9200 + i) * PALETTE.length)],
  a: .35 + hash(9300 + i) * .65, d: hash(9400 + i) * .25,
}));

const ctx = $('#ribbons').getContext('2d');

// camera: starts deep inside the left bar, pulls back to rest by the hit, then a slow push
function camera(t) {
  const p = easeInOut(prog(t, 0, LOCK));
  const zoom = t < LOCK ? Math.exp(Math.log(22) * Math.pow(1 - p, 1.4)) : 1 + .05 * easeInOut(prog(t, LOCK, 8));
  const camx = t < LOCK ? -(BAR.gap + BAR.w * .55) * Math.pow(1 - p, 1.2) : 0;
  return { zoom, camx };
}

function drawMark(t, cam) {
  ctx.clearRect(0, 0, 1080, 1920);
  const { zoom, camx } = cam;
  const X = (x) => CX + (x - camx) * zoom;
  const Y = (y) => CY + y * zoom;
  const lock = easeOut(prog(t, LOCK - .05, LOCK + .45));

  // solid gold H behind the ribbons once they lock
  if (lock > 0) {
    ctx.save();
    ctx.globalAlpha = lock;
    const g = ctx.createLinearGradient(0, Y(-BAR.h / 2), 0, Y(BAR.h / 2));
    g.addColorStop(0, '#fff0c8'); g.addColorStop(.35, '#f0c063'); g.addColorStop(.7, '#b07a2a'); g.addColorStop(1, '#5e3a10');
    ctx.fillStyle = g;
    for (const side of [-1, 1]) {
      const a = X(side * BAR.gap), b = X(side * (BAR.gap + BAR.w));
      ctx.fillRect(Math.min(a, b), Y(-BAR.h / 2), Math.abs(b - a), BAR.h * zoom);
    }
    ctx.fillRect(X(-BAR.gap), Y(-CROSS.h / 2), (2 * BAR.gap) * zoom, CROSS.h * zoom);
    // bevel highlights
    ctx.fillStyle = 'rgba(255,250,235,.55)';
    for (const side of [-1, 1]) {
      const a = X(side * BAR.gap), b = X(side * (BAR.gap + BAR.w));
      ctx.fillRect(Math.min(a, b), Y(-BAR.h / 2), Math.abs(b - a), 3 * zoom);
      ctx.fillRect(Math.min(a, b), Y(-BAR.h / 2), 2 * zoom, BAR.h * zoom);
    }
    ctx.restore();
  }

  // the ribbons, added light on light
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const tunnel = 1 - prog(t, 1.2, LOCK - .2);
  const fade = 1 - .72 * lock;
  for (const r of ribbons) {
    let alpha = r.a * fade * (r.decoy ? tunnel : 1);
    if (alpha < .01) continue;
    const x = X(r.x), w = Math.max(.6, r.w * Math.min(zoom, 6));
    if (x + w < -20 || x - w > 1100) continue;
    // light travels along each ribbon
    const shimmer = .55 + .45 * Math.sin(t * 3 * r.sp + r.ph);
    alpha *= shimmer;
    const ext = 1 - easeInOut(prog(t, .9, LOCK - .05));
    const y0 = Y(r.h0 - r.e0 * ext), y1 = Y(r.h1 + r.e1 * ext);
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    const head = ((t * .45 * r.sp + r.ph) % 1);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(clamp(head - .25), r.c);
    g.addColorStop(head, '#ffffff');
    g.addColorStop(clamp(head + .25), r.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = clamp(alpha);
    ctx.fillStyle = g;
    ctx.fillRect(x - w / 2, y0, w, y1 - y0);
  }
  // crossbar: a sheaf of light shoots across just before the lock
  const sweep = prog(t, 1.75, LOCK);
  if (sweep > 0) {
    for (const c of cross) {
      const k = expoOut(clamp((sweep - c.d) / (1 - c.d)));
      if (k <= 0) continue;
      const xa = X(-BAR.gap), xb = X(lerp(-BAR.gap, BAR.gap, k));
      const y = Y(c.y), h = Math.max(.6, c.w * Math.min(zoom, 4));
      const g = ctx.createLinearGradient(xa, 0, xb, 0);
      g.addColorStop(0, c.c); g.addColorStop(.85, c.c); g.addColorStop(1, '#ffffff');
      ctx.globalAlpha = c.a * fade;
      ctx.fillStyle = g;
      ctx.fillRect(xa, y - h / 2, xb - xa, h);
    }
  }
  ctx.restore();
}

// film grain: one fixed noise tile, offset per frame (a pure function of t)
const gctx = $('#grain').getContext('2d');
const tile = document.createElement('canvas'); tile.width = tile.height = 256;
{
  const tc = tile.getContext('2d'), img = tc.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = hash(i * 1.37) * 255; img.data.set([v, v, v, 255], i * 4); }
  tc.putImageData(img, 0, 0);
}
function grain(t) {
  const f = Math.floor(t * 24);
  gctx.fillStyle = gctx.createPattern(tile, 'repeat');
  gctx.save(); gctx.translate(-Math.floor(hash(f) * 256), -Math.floor(hash(f + 77) * 256));
  gctx.fillRect(0, 0, 540 + 256, 960 + 256); gctx.restore();
}

const word = $('#wordmark'), edge = $('#edge'), sub = $('#sub');
function frame(t) {
  const cam = camera(t);
  drawMark(t, cam);
  grain(t);
  const after = t - LOCK;

  $('#glow').style.opacity = .25 + .75 * easeOut(prog(t, LOCK - .2, LOCK + 1));

  // the hit: flash and an anamorphic streak through the mark
  $('#flash').style.opacity = after < 0 ? 0 : Math.exp(-after * 6) * clamp(after / .03) * .9;
  const fl = $('#flare');
  fl.style.opacity = after < 0 ? 0 : clamp(after / .05) * (.25 + .75 * Math.exp(-after * 2.2));
  fl.style.transform = `scaleX(${after < 0 ? 0 : .6 + .5 * easeOut(clamp(after / .6))}) scaleY(${1 + 2 * Math.exp(-after * 5)})`;

  // wordmark: revealed left to right behind a moving edge of light, tracking settles
  const r = easeInOut(prog(t, 3.35, 4.55));
  word.style.clipPath = `inset(-20px ${100 - r * 100}% -20px 0)`;
  word.style.letterSpacing = `${.05 + .06 * (1 - easeOut(prog(t, 3.35, 5.2)))}em`;
  edge.style.left = `${lerp(90, 990, r)}px`;
  edge.style.opacity = r > 0 && r < 1 ? 1 : Math.max(0, 1 - (t - 4.55) * 4) * (r >= 1 ? 1 : 0);

  // PRODUCTIONS breathes in
  const s = easeOut(prog(t, 4.3, 5.3));
  sub.style.opacity = s;
  sub.style.letterSpacing = `${.9 - .2 * s}em`;
  sub.style.filter = `blur(${(1 - s) * 6}px)`;

  // a final sheen over the wordmark
  const sh = prog(t, 5.6, 6.6);
  $('#sheen').style.opacity = sh > 0 && sh < 1 ? 1 : 0;
  $('#sheen').style.transform = `translateX(${lerp(-300, 1150, easeInOut(sh))}px)`;

  // in from black, out to black
  $('#black').style.opacity = Math.max(1 - prog(t, 0, .35), easeInOut(prog(t, 7.2, 8)));
}

window.film = { frame, duration: 8, ready: document.fonts.ready.then(() => Promise.all([...document.fonts].map((f) => f.load()))) };
</script>
</body>
</html>
