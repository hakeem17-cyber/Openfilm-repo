<!doctype html>
<html><head><meta charset="utf-8"><title>Outro</title>
<link rel="stylesheet" href="shared.css">
<style>
body{background:var(--orange)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.from{display:flex;align-items:center;gap:40px;font-family:var(--fd);font-weight:900}
.from .a{font-size:110px;color:var(--charcoal)}
.from .arr{font-size:90px;color:var(--cream)}
.from .b{font-size:150px}
.cap{margin:28px 0 0;font-size:40px;color:var(--charcoal);max-width:1300px;line-height:1.3;font-family:var(--fd);font-weight:800}
.brand{margin-top:70px;font-size:76px;-webkit-text-stroke:4px var(--charcoal);text-shadow:5px 5px 0 var(--charcoal)}
.src{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:20px;color:var(--charcoal)}
.band{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--charcoal)}
</style></head>
<body>
<div class="wrap">
  <div class="from" id="f"><span class="a">$23K</span><span class="arr">→</span><span class="b disp stroke">$80K+</span></div>
  <p class="cap" id="c">Eighteen years of highs and lows, settled on a new floor.</p>
  <div class="brand disp stroke" id="b">Studiohakim</div>
</div>
<p class="src" id="s">Source: Studiohakim Income Index · Free Lance Account Sheet, 2008/09 to 2026 (2026 to 12 Nov)</p>
<div class="band"></div>
<script type="module">
import {prog,outBack,rise,fontsReady} from "./lib.js";
const $=id=>document.getElementById(id);
window.film={duration:6,ready:fontsReady(),frame(t){
  document.body.style.opacity=prog(t,0,.4);
  rise($("f"),t,.2);rise($("c"),t,.9);
  const p=outBack(prog(t,1.5,2.3));$("b").style.opacity=Math.min(1,p*2);$("b").style.scale=String(.8+.2*p);
  rise($("s"),t,2.2,.7,10);
  document.body.style.opacity=Math.min(prog(t,0,.4),1-prog(t,5.3,6));
}};
</script></body></html>
