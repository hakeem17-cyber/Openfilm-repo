<!doctype html>
<html><head><meta charset="utf-8"><title>Outro</title>
<link rel="stylesheet" href="shared.css">
<style>
body{background:var(--orange)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.from{display:flex;align-items:center;gap:30px;font-family:var(--fd);font-weight:900}
.from .a{font-size:96px;color:var(--charcoal)}
.from .arr{font-size:90px;color:var(--cream)}
.from .b{font-size:140px}
.cap{margin:28px 0 0;font-size:40px;color:var(--charcoal);max-width:1300px;line-height:1.3;font-family:var(--fd);font-weight:800}
.brand{margin-top:70px;font-size:76px;-webkit-text-stroke:4px var(--charcoal);text-shadow:5px 5px 0 var(--charcoal)}
.src{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:20px;color:var(--charcoal)}
.band{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--charcoal)}
</style></head>
<body>
<div class="wrap">
  <div class="from" id="f"><span class="a">$23K</span><span class="arr">→</span><span class="a">$80K+</span><span class="arr" id="ar2">→</span><span class="b disp stroke" id="goal">$100K</span></div>
  <p class="cap" id="c">Eighteen years of highs and lows. Next stop: $100K.</p>
  <div class="brand disp stroke" id="b">Studiohakim</div>
</div>
<p class="src" id="s">Source: Studiohakim Income Index · Free Lance Account Sheet, 2008/09 to 2026 (2026 to 12 Nov)</p>
<div class="band"></div>
<script type="module">
import {prog,outBack,rise,fontsReady} from "./lib.js";
import {TIMING} from "./timing.js";
const D=TIMING.outro.dur,C=TIMING.outro.cues;
const $=id=>document.getElementById(id);
window.film={duration:D,ready:fontsReady(),frame(t){
  document.body.style.opacity=prog(t,0,.4);
  rise($("f"),t,.2);const g=outBack(prog(t,C[1]-.1,C[1]+.6));$("goal").style.opacity=Math.min(1,g*2);$("goal").style.scale=String(.7+.3*g);$("ar2").style.opacity=prog(t,C[1]-.3,C[1]);rise($("c"),t,C[1]+.4);
  const p=outBack(prog(t,C[2]-.2,C[2]+.6));$("b").style.opacity=Math.min(1,p*2);$("b").style.scale=String(.8+.2*p);
  rise($("s"),t,C[2]+.4,.7,10);
  document.body.style.opacity=Math.min(prog(t,0,.4),1-prog(t,D-1,D));
}};
</script></body></html>
