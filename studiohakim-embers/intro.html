<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StudioHakim intro: Embers</title>
<link rel="stylesheet" href="common.css">
<style>
  #stage { background: radial-gradient(80% 55% at 50% 52%, #1a0b05 0%, #080302 55%, #000 100%); }
  #heat { position: absolute; inset: 0; background: radial-gradient(55% 22% at 50% 50%, rgba(255,110,30,.35), rgba(120,30,5,.15) 50%, transparent 80%); }
  #title { top: 795px; font-family: "SH Display"; font-weight: 900; font-size: 200px; line-height: 185px; letter-spacing: .02em; text-indent: .02em; }
  #title span { display: block;
    background: linear-gradient(180deg, #fff6dc 0%, #ffd27a 30%, #ff8a2a 62%, #b8320a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sub { top: 1210px; color: #ffcf9a; font-family: "SH Light"; font-weight: 200; font-size: 40px; letter-spacing: .75em; text-indent: .75em; }
  #flash { position: absolute; inset: 0; background: radial-gradient(70% 35% at 50% 50%, #fff3dc, rgba(255,170,90,.5) 45%, transparent 85%); }
</style>
</head>
<body>
<div id="stage">
  <div id="heat"></div>
  <div id="title" class="center"><span>STUDIO</span><span>HAKIM</span></div>
  <canvas id="fire" class="full" width="1080" height="1920"></canvas>
  <div id="sub" class="center">PRODUCTIONS</div>
  <div id="flash"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vignette"></div>
  <div id="black"></div>
</div>
<script type="module">
import { clamp, prog, lerp, easeOut, easeInOut, hash, makeGrain, fontsReady } from './common.js';
const $ = (s) => document.querySelector(s);
const HIT = 3.0;            // the embers settle into the title (assets/hit.wav)
const CX = 540, CY = 980;   // the vortex
const grain = makeGrain($('#grain'));
const ctx = $('#fire').getContext('2d');
const title = $('#title');

// the title's letters, sampled into points where they are drawn on the page
let targets = [];
function sample() {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const g = c.getContext('2d');
  const cs = getComputedStyle(title);
  g.font = `900 ${cs.fontSize} "SH Display"`;
  g.letterSpacing = cs.letterSpacing;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  for (const span of title.children) {
    const r = span.getBoundingClientRect();
    g.fillText(span.textContent, r.left + r.width / 2 + parseFloat(cs.textIndent) / 2, r.top + r.height / 2);
  }
  const d = g.getImageData(0, 0, 1080, 1920).data;
  const pts = [];
  for (let y = 0; y < 1920; y += 5) for (let x = 0; x < 1080; x += 5) if (d[(y * 1080 + x) * 4 + 3] > 128) pts.push([x, y]);
  targets = pts.map((p, i) => {
    const k = i * 7.13;
    return { tx: p[0], ty: p[1], r: 60 + Math.pow(hash(k), 1.6) * 820, a: hash(k + 1) * 6.283, w: .7 + hash(k + 2) * 1.3,
      d: 1.0 + hash(k + 3) * 1.4, s: 1.6 + hash(k + 4) * 2.2, h: hash(k + 5), fly: hash(k + 6) < .14, fd: hash(k + 8) * 3 };
  });
}

const ambient = Array.from({ length: 160 }, (_, i) => ({ x: hash(i + 900) * 1080, sp: 60 + hash(i + 901) * 160, ph: hash(i + 902) * 1920,
  s: 1 + hash(i + 903) * 2.5, wob: hash(i + 904) * 6.28 }));

// where an ember is at t: spinning in the vortex, then drawn onto its letter
function pos(p, t) {
  const k = easeInOut(prog(t, p.d, HIT));
  const spin = p.a + t * p.w * 1.6 + (1 - k) * 0;
  const r = p.r * (1 - .45 * k) * (1 - .25 * prog(t, 0, HIT));
  return [lerp(CX + Math.cos(spin) * r, p.tx, k), lerp(CY + Math.sin(spin) * r * .38 - (1 - k) * 60, p.ty, k), k];
}
const heatColor = (h, glow) => {
  // deep red → orange → gold → white
  const stops = [[150, 30, 5], [255, 110, 25], [255, 200, 110], [255, 245, 225]];
  const x = clamp(h) * 3, i = Math.min(2, Math.floor(x)), f = x - i;
  const c = stops[i].map((v, j) => Math.round(lerp(v, stops[i + 1][j], f)));
  return `rgba(${c[0]},${c[1]},${c[2]},${glow})`;
};

function draw(t) {
  ctx.clearRect(0, 0, 1080, 1920);
  ctx.globalCompositeOperation = 'lighter';
  const after = t - HIT;
  // embers drifting up the whole time
  for (const a of ambient) {
    const y = 1980 - ((a.ph + t * a.sp) % 2100);
    const x = a.x + Math.sin(t * 1.3 + a.wob) * 30;
    ctx.fillStyle = heatColor(.3 + .4 * a.s / 3.5, .5 * prog(t, 0, 1) * (.5 + .5 * Math.sin(t * 6 + a.wob)));
    ctx.fillRect(x, y, a.s, a.s);
  }
  ctx.lineCap = 'round';
  for (const p of targets) {
    const [x, y, k] = pos(p, t);
    let alpha = prog(t, 0, 1.2) * (.55 + .45 * k);
    let heat = .45 + .35 * k + .2 * (after > 0 ? Math.exp(-after * 2) : 0);
    let fx = x, fy = y, trail = k < .995;
    if (after > 0) {
      trail = false;
      // a few embers lift off the letters and float away
      if (p.fly && after > p.fd * .5) {
        const f = after - p.fd * .5;
        fy -= f * (60 + p.h * 120); fx += Math.sin(f * 2 + p.h * 6) * 18 * f;
        alpha *= Math.max(0, 1 - f / 2.2); heat *= Math.max(.3, 1 - f / 2);
      } else {
        alpha *= .55 + .45 * Math.sin(t * (4 + p.h * 6) + p.h * 20);   // flicker on the letters
        alpha *= lerp(1, .55, easeOut(clamp(after / 1.2)));
      }
    }
    if (alpha <= .01) continue;
    const sz = p.s * (1 + .5 * (1 - k));
    const col = heatColor(heat - .15 + .3 * p.h, clamp(alpha));
    if (trail) {
      const [px, py] = pos(p, t - .06);
      ctx.strokeStyle = col; ctx.lineWidth = sz * .7;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(fx, fy); ctx.stroke();
    } else {
      ctx.fillStyle = col; ctx.fillRect(fx - sz / 2, fy - sz / 2, sz, sz);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function frame(t) {
  draw(t);
  grain(t);
  const after = t - HIT;
  // the letters solidify from the embers
  const solid = easeOut(prog(t, HIT - .1, HIT + .8));
  title.style.opacity = solid;
  title.style.filter = `blur(${(1 - solid) * 10}px) drop-shadow(0 0 ${30 + 30 * Math.exp(-Math.max(0, after) * 2)}px rgba(255,120,40,.55))`;
  title.style.transform = `scale(${1 + .03 * easeInOut(prog(t, HIT, 8))})`;
  $('#heat').style.opacity = after < 0 ? .3 * prog(t, 1, HIT) : .55 + .45 * Math.exp(-after * 1.5) + .08 * Math.sin(t * 3);
  $('#flash').style.opacity = after < 0 ? 0 : Math.exp(-after * 5) * clamp(after / .03) * .75;

  const s = easeOut(prog(t, 4.0, 5.0));
  $('#sub').style.opacity = s;
  $('#sub').style.filter = `blur(${(1 - s) * 6}px)`;
  $('#sub').style.letterSpacing = `${.95 - .2 * s}em`;

  $('#black').style.opacity = Math.max(1 - prog(t, 0, .4), easeInOut(prog(t, 7.2, 8)));
}

window.film = { frame, duration: 8, ready: fontsReady().then(sample) };
</script>
</body>
</html>
