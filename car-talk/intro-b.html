<!doctype html><meta charset="utf-8">
<script type="module">
// Intro B, "Neon night": the sign flickers on over a night road as the car cruises past.
import { stage, S, set, text, OUT, INK, outBack, ease, ramp, lerp, rnd, fontReady, W, H } from './toon.js';
import { sideCar } from './intro-kit.js';
const svg = stage('#15122b');
const defs = S('defs', {}, svg);
const f = S('filter', { id: 'glow', x: '-40%', y: '-40%', width: '180%', height: '180%' }, defs);
S('feGaussianBlur', { stdDeviation: 22 }, f);
for (let i = 0; i < 60; i++) S('circle', { cx: rnd(i) * W, cy: rnd(i + 99) * 900, r: 2 + rnd(i + 7) * 3, fill: '#fff', opacity: .3 + rnd(i + 3) * .6 }, svg);
const city = S('g', {}, svg);
for (let i = 0; i < 12; i++) { const h = 240 + rnd(i) * 420, x = i * 190 - 40; S('rect', { x, y: 1380 - h, width: 170, height: h, fill: '#231f45' }, city); for (let r = 0; r < 8; r++) for (let c = 0; c < 3; c++) if (rnd(i * 31 + r * 7 + c) > 0.5 && r * 54 + 40 < h) S('rect', { x: x + 24 + c * 46, y: 1380 - h + 28 + r * 54, width: 24, height: 28, fill: '#ffd98a', opacity: .8 }, city); }
S('rect', { y: 1380, width: W, height: 540, fill: '#26232f' }, svg);
const dashes = S('g', {}, svg);
for (let i = 0; i < 8; i++) S('rect', { x: i * 300, y: 1620, width: 170, height: 34, rx: 10, fill: '#fff', opacity: .8 }, dashes);
const beam = S('path', { d: 'M0 0 L700 -130 L700 150 Z', fill: '#fff3b0', opacity: .28 }, svg);
const sign = S('g', {}, svg);
S('rect', { x: -470, y: -260, width: 940, height: 520, rx: 50, fill: '#1c1838', stroke: '#3a3466', 'stroke-width': 14 }, sign);
const mk = (str, x, y, size, col) => { const g = S('g', {}, sign); for (const blur of [1, 0]) { const t = S('text', { x, y, 'font-size': size, 'text-anchor': 'middle', fill: blur ? col : '#fff', stroke: col, 'stroke-width': blur ? 26 : 5 }, g); t.textContent = str; if (blur) t.setAttribute('filter', 'url(#glow)'); } return g; };
const n1 = mk('Pod', -230, 40, 230, '#39d5ff'), n2 = mk('CARS', 165, 50, 270, '#ff4fa0'), n3 = mk('TALKING SHOTS ON THE ROAD', 0, 190, 62, '#ffd23f');
const car = sideCar(svg, svg, '#e2483d');
window.film = { duration: 3, ready: fontReady(), frame(t) {
  const fl = (a, seed) => t < a ? 0.07 : t < a + 0.45 ? (rnd(Math.floor(t * 28) + seed) > 0.45 ? 1 : 0.15) : 0.94 + Math.sin(t * 40 + seed) * 0.06;
  n1.style.opacity = fl(0.35, 1); n2.style.opacity = fl(0.8, 5); n3.style.opacity = fl(1.4, 9);
  set(sign, { transform: `translate(540 640) rotate(-4) scale(${0.96 + ease(ramp(t, 0, 3)) * 0.06})` });
  const x = lerp(-700, 1900, ramp(t, 0.2, 3.0));
  set(dashes, { transform: `translate(${-((t * 500) % 300)} 0)` });
  set(city, { transform: `translate(${-t * 30} 0)` });
  set(car.g, { transform: `translate(${x} 1560)` }); car.frame(x, t, Math.abs(Math.sin(t * 12)) * 0.2);
  set(beam, { transform: `translate(${x + 440} 1440)` });
} };
</script>
