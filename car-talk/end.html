<!doctype html><meta charset="utf-8">
<script type="module">
import { stage, S, set, text, OUT, outBack, ramp, makeChar, blinkAt, fontReady, W, H } from './toon.js';
const svg = stage('#ffd23f');
for (let y = 0; y < 34; y++) for (let x = 0; x < 19; x++) S('circle', { cx: x * 60 + (y % 2) * 30, cy: y * 60, r: 3 + y * 0.42, fill: '#f6b92b' }, svg);
const l1 = S('g', {}, svg), l2 = S('g', {}, svg), l3 = S('g', {}, svg);
text(l1, 'DO YOU REVIEW', 0, 0, 170, '#fff');
text(l2, 'YOUR SHOTS', 0, 0, 220, '#e2483d');
text(l3, 'AFTER SHOOTS?', 0, 0, 170, '#fff');
const D = makeChar('D', svg), P = makeChar('P', svg);
const tag = S('g', {}, svg);
S('rect', { x: -400, y: -80, width: 800, height: 120, rx: 30, fill: '#2a1f1a' }, tag);
text(tag, 'DROP YOUR COMMENT BELOW', 0, 8, 70, '#ffd23f', { stroke: 'none' });
window.film = { duration: 4, ready: fontReady(), frame(t) {
  [l1, l2, l3].forEach((l, i) => { const k = outBack(ramp(t, 0.1 + i * 0.22, 0.5 + i * 0.22)); set(l, { transform: `translate(540 ${330 + i * 210}) scale(${k}) rotate(${i === 1 ? -4 : 0})` }); });
  const up = outBack(ramp(t, 0.7, 1.2)), nod = Math.sin(t * 5) * 4;
  D.pose({ x: 290, y: 1330 + (1 - up) * 900, s: 1.05, mouth: 0, smile: 1, look: [0.3, -0.2], blink: blinkAt(t, 0.5), brow: 1, tilt: -5 + nod });
  P.pose({ x: 800, y: 1350 + (1 - up) * 900, s: 1.05, mouth: 0, smile: 1, look: [-0.3, -0.2], blink: blinkAt(t, 1.6), brow: 1, tilt: 5 - nod });
  set(tag, { transform: `translate(540 ${1830 + (1 - outBack(ramp(t, 1.3, 1.7))) * 300 + Math.sin(t * 6) * 6})` });
} };
</script>
