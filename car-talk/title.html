<!doctype html><meta charset="utf-8">
<script type="module">
import { stage, S, set, text, OUT, outBack, ramp, fontReady } from './toon.js';
const svg = stage(null);
const g = S('g', {}, svg);
S('rect', { x: -470, y: -150, width: 940, height: 250, rx: 30, fill: '#ffd23f', ...OUT, 'stroke-width': 12 }, g);
text(g, 'CAR TALK', 0, 50, 210, '#fff');
const sub = S('g', {}, g);
S('rect', { x: -360, y: 80, width: 720, height: 100, rx: 22, fill: '#e2483d', ...OUT }, sub);
text(sub, 'REVIEWING OUR SHOTS', 0, 154, 72, '#fff', { 'stroke-width': 8 });
window.film = { duration: 3.2, ready: fontReady(), frame(t) {
  const k = outBack(ramp(t, 0.15, 0.6)) - ramp(t, 2.8, 3.15) * 1.2;
  set(g, { transform: `translate(${540 + (1 - k) * -1300} 1420) rotate(-5)` });
  set(sub, { transform: `translate(${(1 - outBack(ramp(t, 0.45, 0.9))) * 1300} 0)` });
} };
</script>
