<!doctype html><meta charset="utf-8">
<script type="module">
// Intro C, "Road sign": from the driver's seat, a highway sign with the show's name rushes up.
import { stage, S, set, text, OUT, INK, outBack, ease, ramp, lerp, makeChar, blinkAt, fontReady, W, H } from './toon.js';
const svg = stage('#8fd3f2');
S('circle', { cx: 860, cy: 300, r: 120, fill: '#ffe27a' }, svg);
const clouds = S('g', {}, svg);
for (const [x, y, s] of [[160, 260, 1], [620, 180, .7], [900, 520, .9]]) S('path', { d: 'M0 0 q20 -70 90 -40 q50 -60 110 0 q70 0 50 60 h-260 q-40 -20 10 -20z', fill: '#fff', ...OUT, 'stroke-width': 7, transform: `translate(${x} ${y}) scale(${s})` }, clouds);
S('path', { d: `M-20 900 Q540 820 ${W + 20} 900 V${H} H-20 Z`, fill: '#7cc46a', ...OUT }, svg);
S('path', { d: `M470 880 L610 880 L1500 ${H} L-420 ${H} Z`, fill: '#4a4744', ...OUT }, svg);
const lines = [0, 1, 2, 3, 4].map(() => S('path', { fill: '#fff' }, svg));
const sign = S('g', {}, svg);
S('rect', { x: -330, y: 180, width: 30, height: 520, fill: '#8d939c', ...OUT, 'stroke-width': 7 }, sign);
S('rect', { x: 300, y: 180, width: 30, height: 520, fill: '#8d939c', ...OUT, 'stroke-width': 7 }, sign);
S('rect', { x: -480, y: -300, width: 960, height: 520, rx: 44, fill: '#1f9d55', ...OUT, 'stroke-width': 14 }, sign);
S('rect', { x: -450, y: -270, width: 900, height: 460, rx: 30, fill: 'none', stroke: '#fff', 'stroke-width': 10 }, sign);
text(sign, 'Pod', -225, 0, 210, '#fff', { 'stroke-width': 26 });
text(sign, 'CARS', 175, 10, 250, '#ffd23f', { 'stroke-width': 26 });
text(sign, 'TALKING SHOTS ON THE ROAD', 0, 130, 62, '#fff', { stroke: 'none' });
// the cabin in front of us
const dash = S('g', {}, svg);
S('path', { d: `M-20 1560 Q540 1440 ${W + 20} 1560 V${H + 20} H-20 Z`, fill: '#1f1e23', ...OUT }, dash);
const wheel = S('g', {}, dash);
S('ellipse', { cx: 260, cy: 1800, rx: 330, ry: 230, fill: 'none', stroke: INK, 'stroke-width': 80 }, wheel);
S('ellipse', { cx: 260, cy: 1800, rx: 330, ry: 230, fill: 'none', stroke: '#33323a', 'stroke-width': 62 }, wheel);
S('path', { d: 'M260 1800 L-40 1700 M260 1800 L560 1700 M260 1800 V2040', stroke: '#33323a', 'stroke-width': 62, 'stroke-linecap': 'round' }, wheel);
S('circle', { cx: 260, cy: 1800, r: 76, fill: '#26252b', ...OUT }, wheel);
S('path', { d: `M-20 -20 H${W + 20} V90 Q540 170 -20 90 Z`, fill: '#d8d0c0', ...OUT }, svg);
const mirror = S('g', { transform: 'translate(540 190)' }, svg);
S('rect', { x: -26, y: -110, width: 52, height: 90, fill: '#33323a', ...OUT }, mirror);
S('rect', { x: -250, y: -60, width: 500, height: 150, rx: 44, fill: '#9fd8ee', ...OUT, 'stroke-width': 12 }, mirror);
S('rect', { x: -238, y: -48, width: 476, height: 126, rx: 36 }, S('clipPath', { id: 'mir' }, svg));
const mg = S('g', { 'clip-path': 'url(#mir)' }, mirror);
const D = makeChar('D', mg), P = makeChar('P', mg);
const mic = S('g', {}, svg);
S('path', { d: 'M0 0 V250', ...OUT, 'stroke-width': 7 }, mic);
S('rect', { x: -44, y: 250, width: 88, height: 150, rx: 44, fill: '#c9c9d2', ...OUT }, mic);
S('path', { d: 'M-40 300 H40 M-40 340 H40', ...OUT, 'stroke-width': 6 }, mic);
S('rect', { x: -22, y: 400, width: 44, height: 70, rx: 12, fill: '#33323a', ...OUT, 'stroke-width': 7 }, mic);
window.film = { duration: 3, ready: fontReady(), frame(t) {
  lines.forEach((l, i) => { const k = ((t * 1.6 + i / 5) % 1), k2 = k * k, y = 880 + k2 * 1040, y2 = y + 30 + k2 * 220, w = 8 + k2 * 60, w2 = 8 + (y2 - 880) / 1040 * 60; set(l, { d: `M${540 - w} ${y} H${540 + w} L${540 + w2} ${y2} H${540 - w2} Z` }); });
  set(clouds, { transform: `translate(${-t * 12} 0)` });
  const k = ramp(t, 0.25, 1.25), s = lerp(0.04, 1, k * k * k) * (k >= 1 ? 1 + Math.sin(ramp(t, 1.25, 1.6) * Math.PI) * 0.06 : 1);
  set(sign, { transform: `translate(540 ${lerp(840, 800, k)}) scale(${s})` });
  set(dash, { transform: `translate(0 ${Math.sin(t * 30) * 3})` });
  set(wheel, { transform: `rotate(${Math.sin(t * 2.2) * 5} 260 1800)` });
  const up = k >= 1 ? 1 : 0;
  D.pose({ x: -115, y: 30, s: 0.36, look: [0.4, up ? -0.8 : 0], brow: up * 1.4, smile: 1, blink: blinkAt(t, 0.3) });
  P.pose({ x: 115, y: 30, s: 0.36, look: [-0.4, up ? -0.8 : 0], brow: up * 1.4, smile: 1, blink: blinkAt(t, 1.4) });
  set(mic, { transform: `translate(540 265) rotate(${Math.sin(t * 4) * 9}) scale(.5)` });
} };
</script>
