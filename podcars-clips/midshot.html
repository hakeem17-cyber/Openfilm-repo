<!doctype html><meta charset="utf-8">
<script type="module">
// "Either you go further, or you get a mid shot. Just take a mid shot."
import { stage, S, set, text, OUT, INK, ease, lerp, ramp, outBack, makeChar, blinkAt, fontReady, W, H } from './toon.js';
const R0 = 144.4;
const svg = stage('#cfe6d2');
for (let i = 0; i < 12; i++) S('path', { d: `M0 ${i * 170} H${W}`, stroke: '#bcd9c0', 'stroke-width': 6 }, svg);
const C = makeChar('C', svg);
const shade = S('path', { 'fill-rule': 'evenodd', fill: 'rgba(20,24,30,.62)' }, svg);
const box = S('rect', { fill: 'none', stroke: '#fff', 'stroke-width': 16, rx: 12 }, svg);
const label = S('g', {}, svg);
const lbg = S('rect', { x: -330, y: -90, width: 660, height: 130, rx: 26, ...OUT }, label);
const ltx = text(label, '', 0, 14, 100, '#fff', { 'stroke-width': 10 });
const tick = S('g', {}, svg);
S('circle', { r: 150, fill: '#3fae5a', ...OUT, 'stroke-width': 12 }, tick);
S('path', { d: 'M-70 0 L-20 56 L80 -60', fill: 'none', stroke: '#fff', 'stroke-width': 40, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, tick);
window.film = { duration: 4.1, ready: fontReady(), frame(t) {
  const r = R0 + t, k = ease(ramp(r, 144.7, 146.2));
  C.pose({ x: 540, y: 700, s: 1.15, mouth: 0, smile: 0.4 + k * 0.6, look: [0, 0.1], blink: blinkAt(t, 0.8), brow: k, tilt: Math.sin(t * 2) * 2, hand: k > 0.9 ? [290, 250 + Math.sin(t * 9) * 20] : null, handRot: 15 });
  const x = lerp(330, 150, k), y = lerp(470, 380, k), w = lerp(420, 780, k), h = lerp(430, 1100, k);
  set(box, { x, y, width: w, height: h, stroke: k > 0.95 ? '#3fae5a' : k < 0.05 ? '#e2483d' : '#fff' });
  set(shade, { d: `M0 0 H${W} V${H} H0 Z M${x} ${y} H${x + w} V${y + h} H${x} Z` });
  const mid = k > 0.5;
  ltx.textContent = mid ? 'MID SHOT' : 'TOO TIGHT';
  set(lbg, { fill: mid ? '#3fae5a' : '#e2483d' });
  set(label, { transform: `translate(430 ${y - 90}) rotate(-3)` });
  set(tick, { transform: `translate(900 ${y + h - 60}) scale(${outBack(ramp(r, 146.5, 146.8))})` });
} };
</script>
