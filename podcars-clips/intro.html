<!doctype html><meta charset="utf-8">
<script type="module">
// The show's opening: the car drives in, brakes, and the PodCARS name lands.
import { stage, S, set, text, OUT, INK, outBack, ease, ramp, lerp, makeChar, blinkAt, fontReady, W, H } from './toon.js';
import { burst } from './props.js';
import { podcars, logoReady } from './intro-kit.js';
const svg = stage('#ffd23f');
for (let y = 0; y < 34; y++) for (let x = 0; x < 19; x++) S('circle', { cx: x * 60 + (y % 2) * 30, cy: y * 60, r: 3 + y * 0.42, fill: '#f6b92b' }, svg);
const rays = S('g', {}, svg);
for (let i = 0; i < 14; i++) S('path', { d: 'M0 0 L-90 -1500 L90 -1500 Z', fill: '#ffe27a', opacity: .7, transform: `rotate(${i * (360 / 14)})` }, rays);
S('rect', { y: 1380, width: W, height: 540, fill: '#4a4744', ...OUT }, svg);
const dashes = S('g', {}, svg);
for (let i = 0; i < 8; i++) S('rect', { x: i * 300, y: 1620, width: 170, height: 34, rx: 10, fill: '#fff' }, dashes);
// the car, drawn around the middle of its floor
const car = S('g', {}, svg), bodyG = S('g', {}, car);
S('path', { d: 'M-430 -40 Q-440 -170 -330 -190 L-230 -200 Q-150 -380 0 -390 L150 -390 Q260 -380 330 -210 L400 -190 Q450 -170 440 -40 Z', fill: '#2f9fd6', ...OUT, 'stroke-width': 12 }, bodyG);
S('path', { d: 'M-190 -205 Q-130 -340 0 -345 L-6 -205 Z', fill: '#cfeefa', ...OUT }, bodyG);
S('path', { d: 'M30 -345 L140 -345 Q220 -335 280 -205 L30 -205 Z', fill: '#cfeefa', ...OUT }, bodyG);
const clip = S('clipPath', { id: 'win' }, svg);
S('path', { d: 'M-190 -205 Q-130 -340 0 -345 L-6 -205 Z M30 -345 L140 -345 Q220 -335 280 -205 L30 -205 Z' }, clip);
const riders = S('g', { 'clip-path': 'url(#win)' }, bodyG);
const P = makeChar('P', riders), D = makeChar('D', riders);
S('rect', { x: 380, y: -150, width: 60, height: 50, rx: 14, fill: '#fff7d6', ...OUT, 'stroke-width': 7 }, bodyG);
S('rect', { x: -440, y: -150, width: 40, height: 50, rx: 12, fill: '#e2483d', ...OUT, 'stroke-width': 7 }, bodyG);
S('path', { d: 'M-430 -80 H440', ...OUT, 'stroke-width': 7 }, bodyG);
const wheels = [-250, 250].map((x) => {
  const w = S('g', {}, car);
  S('circle', { r: 86, fill: '#26252b', ...OUT, 'stroke-width': 12 }, w);
  S('circle', { r: 40, fill: '#c9c9d2', ...OUT, 'stroke-width': 7 }, w);
  S('path', { d: 'M-40 0 H40 M0 -40 V40', ...OUT, 'stroke-width': 8 }, w);
  return [w, x];
});
const smoke = [0, 1, 2, 3].map(() => S('circle', { r: 50, fill: '#fff', ...OUT, 'stroke-width': 7 }, svg));
const honk = S('g', {}, svg);
for (const a of [-30, 0, 30]) S('path', { d: 'M0 0 L150 0', stroke: '#e2483d', 'stroke-width': 22, 'stroke-linecap': 'round', transform: `rotate(${a - 20}) translate(60 0)` }, honk);
const logo = S('g', {}, svg);
burst(logo, 330, '#e2483d');
podcars(logo, 225, '#fff', '#ffd23f', 30, { y: 70 });
const tag = S('g', {}, svg);
S('rect', { x: -400, y: -80, width: 800, height: 120, rx: 30, fill: INK }, tag);
text(tag, 'TALKING SHOTS ON THE ROAD', 0, 8, 64, '#ffd23f', { stroke: 'none' });
window.film = { duration: 3, ready: logoReady(), frame(t) {
  set(rays, { transform: `translate(540 800) rotate(${t * 14})` });
  const k = ease(ramp(t, 0.05, 0.85)), x = lerp(-700, 540, k) + (t > 2.75 ? Math.pow((t - 2.75) / 0.25, 2) * 1500 : 0);
  const brake = Math.sin(ramp(t, 0.8, 1.15) * Math.PI), beep = t > 1.3 && t < 1.6 ? Math.sin((t - 1.3) / 0.3 * Math.PI) : t > 1.72 && t < 2.27 ? Math.sin((t - 1.72) / 0.55 * Math.PI) : 0;
  set(dashes, { transform: `translate(${-((x * 0.9 + 4000) % 300)} 0)` });
  set(car, { transform: `translate(${x} 1560)` });
  set(bodyG, { transform: `translate(0 ${-66 - beep * 16}) rotate(${brake * 5}) scale(${1 + beep * 0.03} ${1 - brake * 0.04})` });
  wheels.forEach(([w, wx]) => set(w, { transform: `translate(${wx} -60) rotate(${x * 0.7})` }));
  P.pose({ x: -95, y: -265, s: 0.3, look: [1, 0], smile: 1, blink: blinkAt(t, 1) });
  D.pose({ x: 150, y: -270, s: 0.3, look: [1, 0], smile: 1, mouth: beep * 0.6, blink: blinkAt(t, 0.2) });
  smoke.forEach((c, i) => { const a = ramp(t, 0.75 + i * 0.07, 1.5 + i * 0.07); set(c, { cx: x - 470 - a * (120 + i * 60), cy: 1500 - a * (60 + i * 40), r: 20 + a * 60, opacity: a > 0 && a < 1 ? 1 - a : 0 }); });
  set(honk, { transform: `translate(${x + 450} 1380)`, opacity: beep > 0.3 ? 1 : 0 });
  const p = ramp(t, 0.9, 1.25);
  set(logo, { transform: `translate(540 ${620 + Math.sin(t * 5) * 8}) rotate(-6) scale(${p ? outBack(p) * (1 + beep * 0.03) : 0})` });
  set(tag, { transform: `translate(540 ${1000 + (1 - outBack(ramp(t, 1.5, 1.85))) * -1500}) rotate(3)` });
} };
</script>
